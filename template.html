<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Library</title>
<style>
:root{color-scheme:light;--ink:#241c3f;--mute:#554d70;--acc:#a8450f;--line:#c25be6;--chip:#efe9fb;--chipink:#43357d;--brand:#5b3fd0}
*{box-sizing:border-box}
html{background:#f3edfc}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#fff,#efe7fb);color:var(--ink);
  font-family:system-ui,"Segoe UI",Helvetica,sans-serif}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid #6d4aff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* The whole design lives on a fixed stage that is scaled to fit the window. */
#stage{position:absolute;left:0;top:0;width:1200px;height:900px;transform-origin:0 0}
#flower{position:absolute;left:373px;top:14px;width:816px;height:776px;pointer-events:none;
  filter:drop-shadow(0 16px 30px rgba(120,80,220,.25))}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.brand{position:absolute;left:48px;top:36px}
.brand b{font-size:28px;font-weight:800;display:block;line-height:1.1}
.brand span{font-size:15px;color:var(--mute)}
.hbtn{position:absolute;top:36px;height:46px;border-radius:23px;font-size:16px;font-weight:700;cursor:pointer;padding:0}
#new{left:1008px;width:160px;background:var(--brand);color:#fff;border:0;box-shadow:0 8px 18px rgba(91,63,208,.3)}
#bkbtn{left:880px;width:112px;background:#fff;border:1.5px solid #cfc3ee;color:var(--chipink)}

/* category labels on the petals (each has its own colour) */
.lab{position:absolute;height:46px;border-radius:23px;background:#fff;display:flex;align-items:center;gap:10px;
  padding:0 18px;font-size:17px;font-weight:700;cursor:pointer;border:0;color:var(--ink);
  transform:translate(-50%,-50%);box-shadow:0 8px 20px rgba(106,75,214,.18);transition:opacity .25s,box-shadow .2s;white-space:nowrap}
.lab b{width:12px;height:12px;border-radius:50%;background:var(--c)}
.lab i{font-style:normal;color:var(--acc);font-size:15px}
.lab:hover,.lab.on{box-shadow:0 0 0 2px var(--c),0 12px 24px rgba(106,75,214,.22)}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--c)}
body.searching .lab,body.searching .dot,body.searching .hint,body.searching .tie{opacity:0;pointer-events:none}
.dot,.hint,.tie{transition:opacity .25s}

/* search bar sitting on the pollen */
#glow{position:absolute;left:680px;top:310px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,185,138,.6),rgba(255,185,138,0) 70%);pointer-events:none}
#bar{position:absolute;left:635px;top:398px;width:330px;height:64px;border-radius:32px;background:#fff;
  border:3px solid #ffb26b;display:flex;align-items:center;padding:0 18px;gap:12px;box-shadow:0 12px 26px rgba(106,75,214,.2)}
#bar svg{flex:none}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font-size:18px;color:var(--ink);font-weight:600}
#q::placeholder{color:#645d80;font-weight:400}
#bar:focus-within{box-shadow:0 0 0 3px #6d4aff,0 12px 26px rgba(106,75,214,.2)}
.hint{position:absolute;background:rgba(255,255,255,.85);border-radius:12px;padding:6px 0;left:635px;width:330px;top:480px;text-align:center;font-size:15px;color:var(--mute)}

/* results box: joined to the pollen by a line, like the reference */
#box{position:absolute;left:48px;top:120px;width:400px;height:660px;background:rgba(255,255,255,.95);
  border:1.6px solid var(--line);opacity:0;transform:scale(.96);transform-origin:100% 0;pointer-events:none;
  transition:opacity .22s,transform .22s;display:flex;flex-direction:column}
#box.show{opacity:1;transform:none;pointer-events:auto}
#tab{position:absolute;left:-1.6px;top:-25px;height:24px;padding:0 12px;background:var(--line);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.5px;line-height:24px;white-space:nowrap}
#head{flex:none;padding:18px 18px 8px;font-size:13px;font-weight:700;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cats{flex:none;display:flex;gap:8px;padding:2px 14px 10px;overflow-x:auto}
#cats,#chips{scrollbar-width:none}
#cats::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.cb{flex:none;height:36px;border-radius:18px;border:1.5px solid #d9cff2;background:#fff;padding:0 14px;font-size:14px;font-weight:700;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px}
.cb b{width:10px;height:10px;border-radius:50%;background:var(--c,#64748b)}
.cb.on{background:var(--chipink);border-color:var(--chipink);color:#fff}
#list{overflow:auto;flex:1;padding:0 8px 8px}
.r{padding:14px 12px 10px;border-radius:12px;cursor:pointer;margin-bottom:2px}
.r:hover,.r.cur{background:#f1e6fd}
.r .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.r h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.r .cp{flex:none;font-size:14px;font-weight:700;color:var(--acc);opacity:0}
.r:hover .cp,.r.cur .cp,.r.done .cp{opacity:1}
.r p{margin:5px 0 0;font-size:14px;line-height:1.45;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r mark{background:none;color:var(--acc);font-weight:800}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;min-height:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--chip);color:var(--chipink);font-size:13px;padding:3px 10px;border-radius:12px}
.you{background:#ffe3cc!important;color:var(--acc)!important;font-weight:700}
.acts{flex:none;display:flex;gap:2px}
.act{border:0;background:none;color:var(--chipink);font-size:14px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:8px;text-decoration:underline}
.none{padding:30px 16px;color:var(--mute);font-size:16px}
#foot{flex:none;padding:10px 16px 12px;font-size:13px;color:var(--mute);border-top:1px solid #efe7fb}

/* pop-up windows */
.ov{position:absolute;inset:0;background:rgba(36,28,63,.4);display:none;z-index:5;align-items:center;justify-content:center}
.ov.show{display:flex}
.dlg{width:520px;max-width:94%;background:#fff;border-radius:20px;padding:24px 26px;box-shadow:0 24px 60px rgba(60,30,140,.3);font-size:16px}
.dlg h2{margin:0 0 12px;font-size:21px}
.dlg label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 5px;letter-spacing:.5px}
.dlg input[type=text],.dlg textarea{width:100%;border:1.5px solid #d9cff2;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.dlg textarea{height:150px;resize:vertical}
.btns{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:10px 20px;cursor:pointer;font-size:16px;font-weight:700;background:var(--chip);color:var(--chipink)}
.btn.main{background:var(--brand);color:#fff}
.err{color:#a3180f;font-size:14px;margin-top:6px;min-height:18px}
.dlg p{margin:0 0 6px;line-height:1.5;color:var(--mute)}
#toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:18px;
  font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;max-width:90%;text-align:center}
#toast.show{opacity:1}

/* phone / small-window layout: a 420-wide stage, categories on top, flower, results underneath */
#chips{display:none}
html:has(body.mobile){overflow-x:hidden;overflow-y:auto;height:auto}
body.mobile{height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto;background:linear-gradient(#fff,#efe7fb) fixed}
body.mobile #flower{left:0;top:124px;width:420px;height:399px}
body.mobile .brand{left:16px;top:14px}
body.mobile .brand b{font-size:19px}
body.mobile .brand span{font-size:13px}
body.mobile .hbtn{top:12px;height:44px;font-size:15px}
body.mobile #new{left:268px;width:136px}
body.mobile #bkbtn{left:176px;width:84px}
body.mobile #glow{left:100px;top:218px;width:240px;height:240px}
body.mobile #bar{left:70px;top:306px;width:280px;height:64px}
body.mobile .lab,body.mobile .dot,body.mobile .hint,body.mobile .tie{display:none}
body.mobile #chips{display:flex;position:absolute;left:16px;top:70px;width:388px;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.chipbtn{flex:none;height:44px;border-radius:22px;border:0;background:#fff;padding:0 16px;font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;box-shadow:0 4px 10px rgba(106,75,214,.14);display:flex;align-items:center;gap:8px}
.chipbtn b{width:11px;height:11px;border-radius:50%;background:var(--c,#64748b)}
.chipbtn i{font-style:normal;color:var(--acc)}
.chipbtn.on{box-shadow:0 0 0 2px var(--c,#64748b)}
body.mobile #box{left:16px;top:544px;width:388px;height:400px;transform-origin:50% 0}
body.mobile .r .cp{opacity:1}
body.mobile .act{padding:11px 12px}
body.mobile #foot{display:none}
body.mobile .dlg{width:380px}
</style>
</head>
<body>
<div id="stage">
  <img id="flower" src="__FLOWER__" alt="">
  <svg id="lines" viewBox="0 0 1200 900" aria-hidden="true"></svg>
  <div class="brand"><b>Prompt Library</b><span id="total"></span></div>
  <button class="hbtn" id="bkbtn">Backup</button>
  <button class="hbtn" id="new">+ New prompt</button>
  <div id="labels"></div>
  <div id="chips" role="group" aria-label="Categories"></div>
  <div id="glow"></div>
  <div id="bar">
    <svg width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="#a8450f" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><line x1="14.5" y1="14.5" x2="20" y2="20"/></svg>
    <input id="q" type="text" role="combobox" aria-controls="list" aria-expanded="false" aria-autocomplete="list" placeholder="Type any words you remember…" maxlength="200" autocomplete="off" spellcheck="false" aria-label="Search your prompts" autofocus>
  </div>
  <div class="hint">Type to search, or click a petal to browse</div>
  <div id="box"><div id="tab"></div><div id="head"></div><div id="cats" role="group" aria-label="Filter by category"></div>
    <div id="list" role="listbox" aria-label="Results"></div>
    <div id="foot">↑ ↓ to move · Enter to copy · Esc to clear</div></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>

  <div class="ov" id="modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <h2 id="ftitle">New prompt</h2>
    <label for="f-title">TITLE</label><input type="text" id="f-title" maxlength="80" placeholder="e.g. Explain like I'm five">
    <label for="f-cat">CATEGORY</label><input type="text" id="f-cat" list="catlist" maxlength="30" placeholder="design, writing, general…"><datalist id="catlist"></datalist>
    <label for="f-tags">TAGS (SEPARATE WITH COMMAS)</label><input type="text" id="f-tags" placeholder="teaching, explain">
    <label for="f-text">PROMPT</label><textarea id="f-text" placeholder="Paste your prompt here…"></textarea>
    <div class="err" id="ferr" role="alert"></div>
    <div class="btns"><button class="btn main" id="f-save">Save</button><button class="btn" id="f-cancel">Cancel</button></div>
  </div></div>

  <div class="ov" id="bkmodal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="btitle">
    <h2 id="btitle">Backup</h2>
    <p>Prompts you add are saved in this browser only. Download a backup to keep them safe, or load one to bring them back.</p>
    <div class="err" id="berr" role="alert"></div>
    <div class="btns"><button class="btn main" id="f-export">Download backup</button><button class="btn" id="f-import">Load backup</button><button class="btn" id="b-close">Close</button></div>
    <input type="file" id="f-file" accept="application/json" hidden>
  </div></div>
  <div id="toast" role="status"></div>
</div>
<script>
const BUILTIN = __DATA__;
const KEY = "promptlib.mine.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const str = v => (typeof v === "string" || typeof v === "number") ? String(v) : "";
const slug = v => str(v).trim().toLowerCase().replace(/\s+/g, "-");
/* turns anything (saved data, imported file) into a safe prompt, or null if it is not one */
function clean(p) {
  if (!p || typeof p !== "object" || Array.isArray(p)) return null;
  const title = str(p.title).trim(), text = str(p.text).trim();
  if (!title || !text) return null;
  const tags = (Array.isArray(p.tags) ? p.tags : []).map(slug).filter(Boolean);
  return { id: str(p.id) || uid(), title, category: slug(p.category) || "general", tags, text, mine: true };
}
let MINE = [];
function loadMine() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || "[]"); MINE = (Array.isArray(j) ? j : []).map(clean).filter(Boolean); } catch (e) { MINE = []; }
}
loadMine();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(MINE)); return true; } catch (e) { return false; } };
const all = () => BUILTIN.concat(MINE);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cat = "";          // "" = no category chosen, "*" = every prompt, otherwise a category name
let cur = 0;           // which result row is highlighted

/* ---- fit the stage into the window (phones and short windows get their own layout) ---- */
const vw = () => document.documentElement.clientWidth || innerWidth;   // real visible width (innerWidth can be stretched on phones)
const isMobile = () => vw() < 700 || vw() < innerHeight * 0.9 || innerHeight < 560;
function fit() {
  const mobile = isMobile();
  document.body.classList.toggle("mobile", mobile);
  const W = mobile ? 420 : 1200, H = mobile ? 960 : 900, st = $("stage");
  st.style.width = W + "px"; st.style.height = H + "px";
  $("lines").setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("q").placeholder = mobile ? "Type words you remember…" : "Type any words you remember…";
  const l = $("link");
  if (l) { const a = mobile ? [210, 370, 210, 544] : [448, 120, 635, 430]; ["x1", "y1", "x2", "y2"].forEach((k, i) => l.setAttribute(k, a[i])); }
  const s = mobile ? Math.min(vw() / W, 1.5) : Math.min(vw() / W, innerHeight / H);
  const x = (vw() - W * s) / 2, y = mobile ? 0 : (innerHeight - H * s) / 2;
  st.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
addEventListener("resize", fit);

/* ---- categories ---- */
const SPOTS = [                                   // petal positions
  { x: 440,  y: 200, dx: 639, dy: 210 },
  { x: 1060, y: 200, dx: 862, dy: 128 },
  { x: 300,  y: 640, dx: 555, dy: 490 },
  { x: 1070, y: 560, dx: 933, dy: 336 },
];
const ALLSPOT = { x: 1040, y: 745, dx: 975, dy: 690 };
const ORDER = ["design", "writing", "general", "how-to"];
const PAL = ["#8b5cf6", "#d946ef", "#d97706", "#0d9488", "#2563eb", "#dc2626", "#65a30d", "#0891b2"];
const ln = $("lines");
function catList() {
  const D = all(), found = [...new Set(D.map(d => d.category))];
  const ord = [...ORDER.filter(c => found.includes(c)), ...found.filter(c => !ORDER.includes(c)).sort()];
  return ord.map((c, i) => ({ c, n: D.filter(d => d.category === c).length, color: PAL[i % PAL.length] }));
}
function toggleCat(c) { cat = cat === c ? "" : c; $("q").value = ""; render(); }
function renderLabels() {
  const cats = catList(), D = all();
  $("total").textContent = D.length + " prompts";
  $("labels").innerHTML = ""; $("chips").innerHTML = "";
  let tieHtml = "";
  const mk = (o, p, label, count, color) => {
    tieHtml += `<g class="tie"><line x1="${p.dx}" y1="${p.dy}" x2="${p.x}" y2="${p.y}" stroke="${color}" stroke-width="1.6"/></g>`;
    const dot = document.createElement("div"); dot.className = "dot"; dot.style.cssText = `left:${p.dx}px;top:${p.dy}px;--c:${color}`;
    const b = document.createElement("button"); b.className = "lab"; b.dataset.c = o; b.style.cssText = `left:${p.x}px;top:${p.y}px;--c:${color}`;
    b.setAttribute("aria-label", `${label}, ${count} prompts`);
    b.innerHTML = `<b></b>${esc(label)} <i>${count}</i>`;
    b.onclick = () => toggleCat(o);
    $("labels").append(dot, b);
  };
  cats.slice(0, SPOTS.length).forEach((o, i) => mk(o.c, SPOTS[i], o.c, o.n, o.color));
  mk("*", ALLSPOT, "all prompts", D.length, "#64748b");
  [{ c: "*", n: D.length, color: "#64748b", label: "all" }, ...cats].forEach(o => {
    const ch = document.createElement("button"); ch.className = "chipbtn"; ch.dataset.c = o.c; ch.style.setProperty("--c", o.color);
    ch.innerHTML = `<b></b>${esc(o.label || o.c)}<i>${o.n}</i>`; ch.onclick = () => toggleCat(o.c); $("chips").append(ch);
  });
  ln.querySelectorAll(".tie").forEach(n => n.remove());
  ln.insertAdjacentHTML("afterbegin", tieHtml);
  $("catlist").innerHTML = cats.map(o => `<option value="${esc(o.c)}">`).join("");
}
ln.innerHTML = `<line id="link" x1="448" y1="120" x2="635" y2="430" stroke="#c25be6" stroke-width="1.8" opacity="0" style="transition:opacity .22s"/>`;
renderLabels(); fit();

/* ---- search (every word must match somewhere; tiny typos allowed) ---- */
function near(a, b) {                       // true if the words differ by one typo
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  if (a.length === b.length) {
    let i = 0; while (i < a.length && a[i] === b[i]) i++;
    if (i === a.length) return true;
    if (a.slice(i + 1) === b.slice(i + 1)) return true;                                    // one wrong letter
    return a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2);   // two letters swapped
  }
  const [s, l] = a.length < b.length ? [a, b] : [b, a];
  let i = 0; while (i < s.length && s[i] === l[i]) i++;
  return s.slice(i) === l.slice(i + 1);                                                    // one missing letter
}
const fold = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const cache = new WeakMap();
function hay(item) {
  let h = cache.get(item);
  if (!h) {
    const title = fold(item.title), tags = fold(item.category + " " + item.tags.join(" ")), text = fold(item.text);
    h = { title, tags, text, words: [...new Set((title + " " + tags + " " + text).split(/[^a-z0-9']+/).filter(w => w.length >= 4))] };
    cache.set(item, h);
  }
  return h;
}
function score(item, terms) {
  const h = hay(item);
  let total = 0;
  for (const t of terms) {
    let s = 0;
    if (h.title.includes(t)) s = 5; else if (h.tags.includes(t)) s = 4; else if (h.text.includes(t)) s = 2;
    else if (t.length >= 4 && h.words.some(w => near(t, w))) s = 1;
    if (!s) return 0;
    total += s;
  }
  return total;
}
function hl(s, terms) {                       // highlight on the plain text, escape each piece afterwards
  const ts = terms.filter(t => t.length > 1).sort((a, b) => b.length - a.length);
  if (!ts.length) return esc(s);
  const re = new RegExp("(" + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return s.split(re).map((part, i) => i % 2 ? "<mark>" + esc(part) + "</mark>" : esc(part)).join("");
}

function render() {
  const raw = $("q").value.trim();
  const terms = [...new Set(fold(raw).split(/\s+/).filter(Boolean))].slice(0, 8).map(w => w.slice(0, 60));
  const active = !!(terms.length || cat);
  document.body.classList.toggle("searching", active);
  document.querySelectorAll(".lab,.chipbtn").forEach(l => { const on = l.dataset.c === cat; l.classList.toggle("on", on); l.setAttribute("aria-pressed", on); });
  $("box").classList.toggle("show", active);
  $("q").setAttribute("aria-expanded", active);
  $("link").setAttribute("opacity", active ? 1 : 0);
  if (!active) { $("q").removeAttribute("aria-activedescendant"); return; }

  const restrict = cat && cat !== "*";
  const rows = all().map(d => ({ d, s: terms.length ? score(d, terms) : 1 }))
    .filter(r => r.s && (!restrict || r.d.category === cat));
  if (terms.length) rows.sort((a, b) => b.s - a.s);

  $("tab").textContent = "results · " + rows.length;
  $("live").textContent = rows.length + (rows.length === 1 ? " result" : " results");
  $("head").textContent = terms.length ? `Best matches for “${raw}”` + (restrict ? ` in ${cat}` : "") : (restrict ? `Category · ${cat}` : "All prompts");
  const cl = catList();
  $("cats").innerHTML = "";
  [{ c: "*", color: "#64748b", label: "all" }, ...cl].forEach(o => {
    const on = o.c === "*" ? !restrict : cat === o.c;
    const b = document.createElement("button"); b.className = "cb" + (on ? " on" : ""); b.setAttribute("aria-pressed", on);
    b.style.setProperty("--c", o.color); b.innerHTML = `<b></b>${esc(o.label || o.c)}`;
    b.onclick = () => { cat = o.c; render(); };
    $("cats").append(b);
  });
  const list = $("list"); list.innerHTML = ""; list.scrollTop = 0; cur = 0;
  if (!rows.length) { list.innerHTML = '<div class="none">Nothing found. Try fewer or different words.</div>'; $("q").removeAttribute("aria-activedescendant"); return; }
  rows.forEach(({ d }, i) => {
    const r = document.createElement("div");
    r.className = "r" + (i === 0 ? " cur" : ""); r.id = "r" + i; r.setAttribute("role", "option"); r.setAttribute("aria-selected", i === 0);
    r.title = d.text.slice(0, 400);
    r.innerHTML = `<div class="hd"><h3>${hl(d.title, terms)}</h3><span class="cp">Copy</span></div>
      <p>${hl(d.text.replace(/\s+/g, " "), terms)}</p>
      <div class="ft"><div class="chips">${d.mine ? '<span class="you">yours</span>' : ""}${d.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${d.mine ? `<div class="acts"><button class="act" data-a="edit" aria-label="Edit ${esc(d.title)}">Edit</button><button class="act" data-a="del" aria-label="Delete ${esc(d.title)}">Delete</button></div>` : ""}</div>`;
    r.onclick = ev => {
      const btn = ev.target.closest && ev.target.closest("[data-a]"), a = btn && btn.dataset.a;
      if (a === "edit") return openForm(d);
      if (a === "del") { if (confirm("Delete this prompt?")) { MINE = MINE.filter(m => m.id !== d.id); save(); renderLabels(); render(); toast("Deleted"); } return; }
      copy(d.text, r);
    };
    list.appendChild(r);
  });
  $("q").setAttribute("aria-activedescendant", "r0");
}
function move(step) {                                    // arrow keys
  const rows = [...document.querySelectorAll("#list .r")]; if (!rows.length) return;
  cur = Math.max(0, Math.min(rows.length - 1, cur + step));
  rows.forEach((r, i) => { r.classList.toggle("cur", i === cur); r.setAttribute("aria-selected", i === cur); });
  rows[cur].scrollIntoView && rows[cur].scrollIntoView({ block: "nearest" });
  $("q").setAttribute("aria-activedescendant", rows[cur].id);
}
async function copy(text, row) {
  const cp = row.querySelector(".cp");
  try { await navigator.clipboard.writeText(text); cp.textContent = "Copied"; toast("Copied to clipboard"); }
  catch { cp.textContent = "Press Ctrl+C"; getSelection().selectAllChildren(row); }
  row.classList.add("done");
  setTimeout(() => { cp.textContent = "Copy"; row.classList.remove("done"); }, 1400);
}

$("q").addEventListener("input", () => { if ($("q").value) cat = ""; render(); });
const openOverlay = () => document.querySelector(".ov.show");
addEventListener("keydown", e => {
  const ov = openOverlay();
  if (e.key === "Escape") { $("q").value = ""; cat = ""; closeModals(); render(); return; }
  if (e.key === "Tab" && ov) {                                              // keep keyboard focus inside the pop-up
    const f = [...ov.querySelectorAll("input:not([hidden]),textarea,button")].filter(x => !x.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (ov || e.isComposing || !$("box").classList.contains("show")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter" && e.target.id === "q") { const rows = document.querySelectorAll("#list .r"); if (rows[cur]) rows[cur].click(); }
});

/* ---- pop-up windows ---- */
let lastFocus = null;
function showModal(id, focusId) { lastFocus = document.activeElement; $(id).classList.add("show"); $(focusId).focus(); }
function closeModals() {
  const was = openOverlay();
  document.querySelectorAll(".ov").forEach(o => o.classList.remove("show"));
  if (was && lastFocus && lastFocus.focus) lastFocus.focus();
}
let editing = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1900); }
function openForm(d) {
  editing = d && d.mine ? d.id : null;
  $("ftitle").textContent = editing ? "Edit prompt" : "New prompt";
  $("f-title").value = d ? d.title : ""; $("f-cat").value = d ? d.category : (cat && cat !== "*" ? cat : "");
  $("f-tags").value = d ? d.tags.join(", ") : ""; $("f-text").value = d ? d.text : "";
  $("ferr").textContent = ""; showModal("modal", "f-title");
}
const closeForm = closeModals;
addEventListener("storage", e => { if (e.key === KEY || e.key === null) { loadMine(); renderLabels(); render(); } });   // another tab changed things
$("new").onclick = () => openForm(null);
$("f-cancel").onclick = closeModals;
$("bkbtn").onclick = () => { $("berr").textContent = ""; showModal("bkmodal", "f-export"); };
$("b-close").onclick = closeModals;
document.querySelectorAll(".ov").forEach(o => o.addEventListener("mousedown", e => { if (e.target === o) closeModals(); }));
$("f-save").onclick = () => {
  const title = $("f-title").value.trim(), text = $("f-text").value.trim();
  if (!title || !text) { $("ferr").textContent = "Please add a title and the prompt text."; return; }
  const c = clean({ title, text, category: $("f-cat").value, tags: $("f-tags").value.split(",") });
  const old = editing && MINE.find(x => x.id === editing);
  if (old) Object.assign(old, c, { id: old.id }); else MINE.push(c);
  const ok = save();
  closeModals(); renderLabels(); render();
  toast(ok ? (editing ? "Prompt updated" : "Prompt saved") : "Added, but your browser blocked saving. Use Backup.");
};
$("f-export").onclick = () => {
  if (!MINE.length) { toast("You haven't added any prompts yet"); return; }
  const blob = new Blob([JSON.stringify(MINE, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my-prompts.json"; a.click();
};
$("f-import").onclick = () => $("f-file").click();
$("f-file").onchange = async e => {
  try {
    const file = e.target.files[0]; if (!file) return;
    const list = JSON.parse(await file.text());
    let n = 0;
    if (!Array.isArray(list)) throw new Error("not a list");
    for (const p of list) { const c = clean(p); if (c && !MINE.some(m => m.id === c.id)) { MINE.push(c); n++; } }
    save(); renderLabels(); render(); closeModals(); toast(n + " prompts imported");
  } catch (err) { $("berr").textContent = "That file isn't a valid backup."; }
  e.target.value = "";
};
render();
</script>
</body>
