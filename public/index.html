<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Library</title>
<meta name="description" content="imprompto: a flower-shaped place to keep, search and copy your AI prompts. Everything stays in your own browser.">
<meta name="theme-color" content="#f3edfc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c9b8f5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb26b'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#241c3f;--mute:#554d70;--acc:#a8450f;--line:#c25be6;--chip:#efe9fb;--chipink:#43357d;--brand:#5b3fd0}
*{box-sizing:border-box}
html{background:#f3edfc}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#fff,#efe7fb);color:var(--ink);
  font-family:system-ui,"Segoe UI",Helvetica,sans-serif}
button,input,textarea{font-family:inherit}
button:active{transform:scale(.97)}
.lab:active{transform:translate(-50%,-50%) scale(.97)}   /* keep the label centred while pressed, or the click misses */
:focus-visible{outline:3px solid #6d4aff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* The whole design lives on a fixed stage that is scaled to fit the window. */
#stage{position:absolute;left:0;top:0;width:1200px;height:900px;transform-origin:0 0}
#flower{position:absolute;left:373px;top:14px;width:816px;height:776px;pointer-events:none;
  filter:drop-shadow(0 16px 30px rgba(120,80,220,.25));animation:float 8s ease-in-out infinite alternate;will-change:transform}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes pop{from{opacity:0;scale:.85}}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}}
#bloom{position:absolute;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,var(--c,#8b5cf6),transparent 68%);transition:opacity .25s;mix-blend-mode:multiply}
#bloom.on{opacity:.42}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.brand{position:absolute;left:48px;top:36px}
.brand h1{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.brand span{font-size:15px;color:var(--mute)}
.hbtn{position:absolute;top:36px;height:46px;border-radius:23px;font-size:16px;font-weight:700;cursor:pointer;padding:0}
#new{left:1008px;width:160px;background:var(--brand);color:#fff;border:0;box-shadow:0 8px 18px rgba(91,63,208,.3)}
#sobtn:hover{background:var(--chip)}
#new:hover{filter:brightness(1.12)}
#sobtn{left:880px;width:112px;background:#fff;border:1.5px solid #cfc3ee;color:var(--chipink)}
/* category labels on the petals (each has its own colour) */
.lab{position:absolute;height:46px;border-radius:23px;background:#fff;display:flex;align-items:center;gap:10px;
  padding:0 18px;font-size:17px;font-weight:700;cursor:pointer;border:0;color:var(--ink);
  transform:translate(-50%,-50%);box-shadow:0 8px 20px rgba(106,75,214,.18);transition:opacity .25s,box-shadow .2s;white-space:nowrap;
  animation:pop .5s backwards}
.lab b{width:12px;height:12px;border-radius:50%;background:var(--c)}
.lab i{font-style:normal;color:var(--acc);font-size:15px}
.lab:hover,.lab:focus-visible,.lab.on{box-shadow:0 0 0 2px var(--c),0 12px 24px rgba(106,75,214,.22)}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--c);
  animation:pop .5s backwards;transition:box-shadow .25s,opacity .25s}
.dot.hot,.dot.sel{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 30%,transparent)}
body.searching #coach{opacity:0;pointer-events:none}
.tie{transition:opacity .25s}
.lab{touch-action:none;user-select:none;-webkit-user-select:none}
.lab.drag{cursor:grabbing;box-shadow:0 0 0 2px var(--c),0 18px 34px rgba(106,75,214,.3);z-index:3}
.lab.open{box-shadow:0 0 0 2px var(--c),0 12px 24px rgba(106,75,214,.22)}
.dim{opacity:.3!important}
.tie path{transition:stroke-width .2s}
.tie.hl path{stroke-width:3}
/* seeds: the prompts inside a sprig, floating around it */
.seed{position:absolute;height:30px;border-radius:15px;background:#fff;border:0;padding:0 10px;display:flex;align-items:center;gap:0;
  transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap;z-index:2;
  box-shadow:0 0 0 2px var(--c),0 6px 14px rgba(106,75,214,.2);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.seed.show{opacity:1;visibility:visible;transition-delay:0s}
.seed b{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.seed span{max-width:0;overflow:hidden;opacity:0;margin-left:0;transition:max-width .25s,opacity .2s,margin .25s}
.seed.full span,.seed:hover span,.seed:focus-visible span{max-width:130px;opacity:1;margin-left:7px}
.seed.all{background:var(--c);color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.seed.all b{background:#fff}
.slink{stroke-width:1.2;opacity:0;transition:opacity .2s;pointer-events:none}
.slink.show{opacity:.55}
#peek{position:absolute;width:250px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 16px 36px rgba(60,30,140,.28);
  z-index:4;pointer-events:none;opacity:0;transition:opacity .15s;font-size:14px;line-height:1.45;border-top:4px solid var(--c,#8b5cf6)}
#peek.show{opacity:1}
#peek h4{margin:0 0 4px;font-size:15px}
#peek p{margin:0;color:var(--mute);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#peek .tg{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
#peek .tg span{background:var(--chip);color:var(--chipink);font-size:12px;padding:2px 8px;border-radius:10px}
#peek em{display:block;margin-top:8px;font-size:12px;font-style:normal;font-weight:700;color:var(--acc)}
body.searching .seed:not(.rseed),body.searching #peek,body.searching .slink:not(.rs){opacity:0;pointer-events:none;visibility:hidden}
body.mobile .seed,body.mobile #peek,body.mobile .slink{display:none}
/* search bar sitting on the pollen */
#glow{position:absolute;left:680px;top:310px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,185,138,.6),rgba(255,185,138,0) 70%);pointer-events:none;animation:pulse 4s ease-in-out infinite}
#bar{position:absolute;left:635px;top:398px;width:330px;height:64px;border-radius:32px;background:#fff;
  border:3px solid #ffb26b;display:flex;align-items:center;padding:0 10px 0 18px;gap:12px;box-shadow:0 12px 26px rgba(106,75,214,.2)}
#bar svg{flex:none}
#q{flex:1;min-width:0;border:0;outline:0;background:none;font-size:18px;color:var(--ink);font-weight:600}
#q::placeholder{color:#645d80;font-weight:400}
#bar:focus-within{box-shadow:0 0 0 3px #6d4aff,0 12px 26px rgba(106,75,214,.2)}
#clr{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--chip);color:var(--chipink);font-size:22px;line-height:1;cursor:pointer;display:none}
#clr.show{display:block}
#coach{position:absolute;left:615px;bottom:522px;width:370px;background:var(--brand);color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.4;
  box-shadow:0 14px 30px rgba(91,63,208,.35);transition:opacity .25s;animation:pop .6s .6s backwards;display:none}
#coach.show{display:block}
#coach:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;width:18px;height:18px;background:var(--brand);transform:rotate(45deg);border-radius:3px}
#coach button{display:block;margin-top:10px;border:0;border-radius:14px;background:#fff;color:var(--brand);font-weight:700;font-size:15px;padding:7px 16px;cursor:pointer}
/* results box: joined to the pollen by a line, like the reference */
#box{position:absolute;left:48px;top:120px;width:400px;height:660px;background:rgba(255,255,255,.95);
  border:1.6px solid var(--line);opacity:0;transform:scale(.96);transform-origin:100% 0;pointer-events:none;
  transition:opacity .22s,transform .22s;display:flex;flex-direction:column}
#box.show{opacity:1;transform:none;pointer-events:auto}
#tab{position:absolute;left:-1.6px;top:-25px;height:24px;padding:0 12px;background:var(--line);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.5px;line-height:24px;white-space:nowrap}
#head{flex:none;padding:18px 18px 8px;font-size:13px;font-weight:700;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cats{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 10px}
#cats,#chips{scrollbar-width:none}
#cats::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.cb{flex:none;height:36px;border-radius:18px;border:1.5px solid #d9cff2;background:#fff;padding:0 13px;font-size:14px;font-weight:700;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px}
.cb b{width:10px;height:10px;border-radius:50%;background:var(--c,#64748b)}
.cb:hover{border-color:var(--chipink)}
.cb.on{background:var(--chipink);border-color:var(--chipink);color:#fff}
#list{overflow:auto;flex:1;padding:0 8px 8px}
.r{padding:14px 12px 10px;border-radius:12px;cursor:pointer;margin-bottom:2px;animation:rowin .28s backwards}
.r:hover,.r.cur{background:#f1e6fd}
.r .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.r h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.r .cp{flex:none;font-size:14px;font-weight:700;color:var(--acc);opacity:.6}
.r:hover .cp,.r.cur .cp,.r.done .cp{opacity:1}
.r p{margin:5px 0 0;font-size:14px;line-height:1.45;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r mark{background:none;color:var(--acc);font-weight:800}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;min-height:34px}
.chips{display:flex;flex-wrap:wrap;align-items:center}
.chips span{color:#8a82a6;font-size:12.5px;font-weight:500}
.chips span+span:before{content:" \0000b7 ";white-space:pre}
.you{background:#ffe3cc;color:var(--acc)!important;font-weight:700!important;padding:1px 9px;border-radius:10px;margin-right:8px}
.chips .you+span:before{content:""}
.acts{flex:none;display:flex;gap:2px}
.act{border:0;background:none;color:var(--chipink);font-size:14px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:8px;text-decoration:underline}
.none{padding:26px 16px;color:var(--mute);font-size:16px;line-height:1.5}
.none .sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#foot{flex:none;padding:10px 16px 12px;font-size:13px;color:var(--mute);border-top:1px solid #efe7fb}
/* pop-up windows */
.ov{position:absolute;inset:0;background:rgba(36,28,63,.4);box-shadow:0 0 0 4000px rgba(36,28,63,.4);display:none;z-index:5;align-items:center;justify-content:center}
.ov.show{display:flex}
.dlg{width:520px;max-width:94%;background:#fff;border-radius:20px;padding:24px 26px;box-shadow:0 24px 60px rgba(60,30,140,.3);font-size:16px;animation:pop .2s}
.dlg h2{margin:0 0 12px;font-size:21px}
.dlg label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 5px;letter-spacing:.5px}
.dlg input[type=text],.dlg textarea{width:100%;border:1.5px solid #d9cff2;border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.dlg textarea{height:150px;resize:vertical}
.btns{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:10px 20px;cursor:pointer;font-size:16px;font-weight:700;background:var(--chip);color:var(--chipink)}
.btn.main{background:var(--brand);color:#fff}
.err{color:#a3180f;font-size:14px;margin-top:6px;min-height:18px}
.dlg p{margin:0 0 6px;line-height:1.5;color:var(--mute)}
#toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:18px;
  font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;max-width:90%;text-align:center}
#toast.show{opacity:1}
.btn:hover{filter:brightness(.96)}
.btn.main:hover{filter:brightness(1.12)}
/* phone / small-window layout: a 420-wide stage, categories on top, flower, results underneath */
#chips{display:none}
html:has(body.mobile){overflow-x:hidden;overflow-y:auto;height:auto}
body.mobile{height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto;background:linear-gradient(#fff,#efe7fb) fixed}
body.mobile #flower{left:0;top:124px;width:420px;height:399px}
body.mobile #bloom{display:none}
body.mobile .brand{left:16px;top:14px}
body.mobile .brand h1{font-size:19px}
body.mobile .brand span{font-size:13px}
body.mobile .sv{display:none}
body.mobile .hbtn{top:12px;height:44px;font-size:15px}
body.mobile #new{left:268px;width:136px}
body.mobile #sobtn{left:166px;width:94px}
body.mobile #glow{left:100px;top:218px;width:240px;height:240px}
body.mobile #bar{left:70px;top:306px;width:280px;height:64px}
body.mobile .lab,body.mobile .dot,body.mobile .tie{display:none}
body.mobile #coach{left:50px;bottom:672px;width:320px;font-size:15px}
body.mobile #chips{display:flex;position:absolute;left:16px;top:70px;width:388px;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.chipbtn{flex:none;height:44px;border-radius:22px;border:0;background:#fff;padding:0 16px;font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;box-shadow:0 4px 10px rgba(106,75,214,.14);display:flex;align-items:center;gap:8px}
.chipbtn b{width:11px;height:11px;border-radius:50%;background:var(--c,#64748b)}
.chipbtn i{font-style:normal;color:var(--acc)}
.chipbtn.on{box-shadow:0 0 0 2px var(--c,#64748b)}
body.mobile #box{left:16px;top:544px;width:388px;height:400px;transform-origin:50% 0}
body.mobile .r .cp{opacity:1}
body.mobile .act{padding:11px 12px}
body.mobile #foot{display:none}
body.mobile .dlg{width:380px}
body[data-mode=seeds] #box{left:630px;width:340px;height:auto;max-height:270px;border-top:5px solid var(--c,#8b5cf6);border-radius:16px}
body[data-mode=seeds] #box:before{background:var(--c,#8b5cf6);top:-13px}
body[data-mode=seeds] #list{padding:10px 8px 2px;overflow:visible;flex:none}
body[data-mode=seeds] .r:not(.cur){display:none}
body[data-mode=seeds] .r.cur{background:none;box-shadow:none;padding:6px 12px}
body[data-mode=seeds] .r.cur p{-webkit-line-clamp:4}
body[data-mode=seeds] #foot{border-top:0;padding:4px 18px 12px}
</style>
</head>

 "prompts/design/tips-to-master-graphic-design-prompts.md"}, {"title": "UI redesign from reference", "category": "design", "tags": ["ui", "svg", "redesign"], "text": "I think you can do better. [issues with old design]. redesign me the [application] using the reference. [what you like about reference]. output 2 svg mockup images.", "file": "prompts/design/ui-redesign-from-reference.md"}, {"title": "Vintage artisanal emblem", "category": "design", "tags": ["graphic-design", "image-gen", "logo"], "text": "Vintage retro emblem logo for a craft coffee roastery, featuring a detailed line-art engraving of a roaring bear holding a coffee branch, distressed woodcut texture, warm mahogany and cream color palette, hand-drawn typography framing the circular border, 19th-century aesthetic", "file": "prompts/design/vintage-artisanal-emblem.md"}, {"title": "Depth to task", "category": "general", "tags": ["rewrite", "prompt-improving"], "text": "I want a deeper version of this task, not a bigger one. Before rewriting it: (1) say what a top professional in this field would do here that I’m not asking for; (2) name the rawest material they would start from instead of what has already been digested for me; (3) name the specific methods and tools they would use; (4) say what, other than you or me, would show the result is right. Then rewrite my prompt to ask for exactly that.", "file": "prompts/general/depth-to-task.md"}, {"title": "Explanation examples and analogies", "category": "general", "tags": ["teaching", "explain"], "text": "You are an experienced teacher and can generate clear, accurate examples for students of concepts. I want you to ask me two questions: What concept do I want explained. Wait for me to answer and then ask me the second question: Who is the audience for the explanation? Then look up the concept and examples of the concept. Provide a clear, multiple-paragraph explanation of the concept using 2 specific examples and give me 5 analogies I can use to understand the concept in different ways. apply the skill after the questions @fast", "file": "prompts/general/explanation-examples-and-analogies.md"}, {"title": "Find sources for my paragraph", "category": "general", "tags": ["research", "writing", "sources"], "text": "Find sources to support my paragraph, give me the context and the links to verify relevance, weave the sources into my writing.", "file": "prompts/general/find-sources-for-my-paragraph.md"}, {"title": "Organising file tree structure", "category": "general", "tags": ["files", "organise"], "text": "Suggest a simple folder structure for these files, with no more than seven top-level folders. Show me the plan as a list of what would move where, and wait for my approval.", "file": "prompts/general/organising-file-tree-structure.md"}, {"title": "Syllabus designer", "category": "general", "tags": ["teaching", "curriculum"], "text": "You are an expert learning designer specializing in building curricula for classes that promote direct instruction, active learning, retrieval practice, formative assessment, low-stakes testing, making connections between concepts, uncovering misconceptions, and interleaving. First ask me what course I'm teaching, including subject matter. Wait for my response. Then ask what learning levels my students are (high school or college). Wait for my response. Then ask how many times my students and I will meet (have class) over the course of the semester and what topics I generally cover. Wait for my response. Then design a curriculum that makes sure students learn effectively.", "file": "prompts/general/syllabus-designer.md"}, {"title": "Edit an app database in BlueStacks via ADB", "category": "how-to", "tags": ["bluestacks", "adb", "sqlite", "android"], "text": "Path: C:\\ProgramData\\BlueStacks_nxt\\Engine\\Pie64\n\nExtract, Edit, and Push via ADB (Recommended). This approach bypasses file system limitations by pulling the database file directly out of the running emulator, editing it on your e.' Avoid ending paragraphs with neat summary moral lessons.", "file": "prompts/writing/ban-ai-tropes.md"}, {"title": "Brainstorming obstacles", "category": "writing", "tags": ["creative-writing", "sparring"], "text": "Give me 5 non-cliché physical complications that could prevent my protagonist from leaving the room without raising the alarm.", "file": "prompts/writing/brainstorming-obstacles.md"}, {"title": "Chain-of-thought story steps", "category": "writing", "tags": ["creative-writing", "structure"], "text": "Step 1: Outline the 5 main story beats of the scene.\nStep 2: Generate 3 alternative twists for Beat 3.\nStep 3: Write only the opening sensory hook (50–100 words).\nStep 4: Iterate and expand.", "file": "prompts/writing/chain-of-thought-story-steps.md"}, {"title": "Character profile and fatal flaw", "category": "writing", "tags": ["storyline", "character"], "text": "Create a character profile for a [Role/Archetype] named [Name]. Focus on their internal contradiction: what is their core desire versus their deepest lie/flaw? Outline how this flaw will cause them to make a catastrophic decision in Act 2.", "file": "prompts/writing/character-profile-and-fatal-flaw.md"}, {"title": "Dialogue doctor", "category": "writing", "tags": ["creative-writing", "sparring"], "text": "Rewrite this dialogue exchange 3 ways: 1) where they are hiding a secret, 2) passive-aggressive, 3) fast-paced/clipped.", "file": "prompts/writing/dialogue-doctor.md"}, {"title": "Feed style passages", "category": "writing", "tags": ["creative-writing", "style"], "text": "Analyze the tone, sentence length, and sensory focus of the excerpt below. Then, write a scene about a train station delay using that exact style.\n\n[Insert 1-2 paragraphs of your favorite author or your own best writing]", "file": "prompts/writing/feed-style-passages.md"}, {"title": "High-tension scene beat sheet", "category": "writing", "tags": ["storyline", "scene"], "text": "I need to write a high-tension scene where [Character A] must [Goal] while [Character B] tries to [Opposing Goal]. Provide a scene beat sheet detailing:\n- Opening emotional state\n- The immediate physical or verbal obstacle\n- The escalating stakes mid-scene\n- The turn/realization\n- The cliffhanger or outcome that forces the next action", "file": "prompts/writing/high-tension-scene-beat-sheet.md"}, {"title": "Pacing and twist enhancer", "category": "writing", "tags": ["storyline", "scene"], "text": "Review this scene summary: [Insert Scene Summary]. Suggest 3 plot twists or narrative shifts that escalate the stakes, flip character power dynamics, or reveal a secret that changes the direction of the scene.", "file": "prompts/writing/pacing-and-twist-enhancer.md"}, {"title": "Premise generator", "category": "writing", "tags": ["storyline", "world-building"], "text": "Act as a narrative strategist. Combine the core theme of [Theme, e.g., corporate surveillance] with a genre mashup of [Genre 1] and [Genre 2]. Give me 3 high-concept plot premises, each with a unique central conflict, an inciting incident, and the core stakes for the protagonist.", "file": "prompts/writing/premise-generator.md"}, {"title": "Reverse interviewing (sunken colony ship)", "category": "writing", "tags": ["creative-writing", "interview"], "text": "I have an idea for a sci-fi story set on a sunken colony ship. Act as a investigative journalist interviewing me. Ask me 5 sharp, probing questions one by one to help me flesh out the social hierarchy, energy source, and main conflict of this world.", "file": "prompts/writing/reverse-interviewing-sunken-colony-ship.md"}, {"title": "Sensory layering", "category": "writing", "tags": ["creative-writing", "sparring"], "text": "Here is a flat scene: [Insert text]. Rewrite it focusing strictly on sound, smell, and tactile temperature, omitting visual descriptions.", "file": "prompts/writing/sensory-layering.md"}, {"title": "Setting and environment", "category": "writing", "tags": ["storyline", "world-building"], "text": "I am designing a setting called [Name/Type of Place]. Describe 5 sensory details of this world that reveal its social structure, history, or underlying tension without explicitly explaining it to the reader.", "file": "prompts/writing/setting-and-environment.md"}, {"title": "Subplot integration", "category": "writing", "tags": ["storyline", "plot"], "text": "Here is my main plot: [Brief summary]. Generate 3 distinct subplot options (e.g., romantic, betrayal, mystery, mentor-student) that run parallel to the main narrative and directly mirror or challenge the protagonist's central internal conflict.", "file": "prompts/writing/subplot-integration.md"}, {"title": "The brutal developmental editor", "category": "writing", "tags": ["creative-writing", "persona"], "text": "Act as an aggressive line editor. Read this scene and tell me where the pacing drags, where the dialogue sounds robotic, and which cliché tropes I should cut. Do not rewrite it for me—give me structural critique.", "file": "prompts/writing/the-brutal-developmental-editor.md"}, {"title": "The character psychologist", "category": "writing", "tags": ["creative-writing", "persona"], "text": "Act as a character psychologist. Interview me about my main character's childhood trauma so I can discover their subconscious motivations.", "file": "prompts/writing/the-character-psychologist.md"}];
const KEY = "promptlib.mine.v1", SEEN = "promptlib.seen.v1";

const str = v => (typeof v === "string" || typeof v === "number") ? String(v) : "";
const slug = v => str(v).trim().toLowerCase().replace(/\s+/g, "-");
/* turns anything (saved data, imported file) into a safe prompt, or null if it is not one */
function clean(p) {
  if (!p || typeof p !== "object" || Array.isArray(p)) return null;
  const title = str(p.title).trim(), text = str(p.text).trim();
  if (!title || !text) return null;
  const tags = (Array.isArray(p.tags) ? p.tags : []).map(slug).filter(Boolean);
  return { id: str(p.id) || uid(), title, category: slug(p.category) || "general", tags, text, mine: true, ...(str(p.from) && { from: str(p.from) }) };   // "from" = the built-in prompt this one replaces
}
let MINE = [];
function loadMine() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || "[]"); MINE = (Array.isArray(j) ? j : []).map(clean).filter(Boolean); } catch (e) { MINE = []; }
}
loadMine();
const save = () => { let ok = true; try { localStorage.setItem(KEY, JSON.stringify(MINE)); localStorage.setItem(DIRTY, "1"); } catch (e) { ok = false; } sync(); return ok; };
const all = () => BUILTIN.filter(b => !MINE.some(m => m.from === b.file)).concat(MINE);   // an edited built-in hides the original
/* ---- sync: your prompts are also kept in the cloud so every device shares them ---- */

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
let syncing = false, again = false, cloudOK = false;
async function sync() {
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    for (let i = 0; i < 3; i++) {
      const r = await fetch("/api/data", { cache: "no-store" });
      if (!r.ok) return;                                   // no cloud (offline or not signed in): keep working locally
      const { data, updated, email } = await r.json();
      if (email && lsGet(OWNER) && lsGet(OWNER) !== email) { [KEY, BASE, DIRTY].forEach(k => lsSet(k, null)); MINE = []; }   // a different person signed in on this browser
      if (email) lsSet(OWNER, email);
      if (!cloudOK) { cloudOK = true; if (window.renderLabels) renderLabels(); }
      const remote = Array.isArray(data) ? data.map(clean).filter(Boolean) : null;
      const dirty = lsGet(DIRTY) === "1" || (lsGet(BASE) == null && MINE.length);
      if (remote && !dirty) { MINE = remote; lsSet(BASE, String(updated)); try { localStorage.setItem(KEY, JSON.stringify(MINE)); } catch (e) {} if (window.renderLabels) { renderLabels(); render(); } return; }
      if (remote && lsGet(BASE) !== String(updated)) for (const c of remote) if (!MINE.some(m => m.id === c.id)) MINE.push(c);   // keep prompts added on other devices
      const put = await fetch("/api/data", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ base: updated, data: MINE }) });
      if (put.ok) { lsSet(BASE, String((await put.json()).updated)); lsSet(DIRTY, null); try { localStorage.setItem(KEY, JSON.stringify(MINE)); } catch (e) {} if (window.renderLabels) { renderLabels(); render(); } return; }
      if (put.status !== 409) return;                      // otherwise a newer version appeared: look again
    }
  } catch (e) { /* offline: try again later */ }
  finally { syncing = false; if (again) { again = false; sync(); } }
}

    const f = { o, p, b, dot, color, ph: k * 1.9, amp: 1, hold: false, x: p.x, y: p.y, vx: 0, vy: 0, seeds: [], rs: [], label, total: count, open: false, peek: false, drag: null };
    $("labels").append(dot, b);

  $("f-title").value = d ? d.title : ""; $("f-cat").value = d ? d.category : (cat && cat !== "*" ? cat : "");
  $("f-tags").value = d ? d.tags.join(", ") : ""; $("f-text").value = d ? d.text : "";
  $("ferr").textContent = ""; showModal("modal", "f-title");
}
const closeForm = closeModals;
$("f-save").onclick = () => {
  const title = $("f-title").value.trim(), text = $("f-text").value.trim();
  if (!title || !text) { $("ferr").textContent = "Please add a title and the prompt text."; return; }
  const c = clean({ title, text, category: $("f-cat").value, tags: $("f-tags").value.split(","), from: editingFrom });
  const old = editing && MINE.find(x => x.id === editing);
  if (old) Object.assign(old, c, { id: old.id, from: old.from }); else MINE.push(c);
  const ok = save();
  closeModals(); renderLabels(); render();
  toast(ok ? (editing || editingFrom ? "Prompt updated" : "Prompt saved") : "Added, but your browser blocked saving.");
};
addEventListener("storage", e => { if (e.key === KEY || e.key === null) { loadMine(); renderLabels(); render(); } });   // another tab changed things
$("new").onclick = () => openForm(null);
$("sobtn").onclick = () => { [KEY, BASE, DIRTY, OWNER].forEach(k => lsSet(k, null)); location.href = "/cdn-cgi/access/logout"; };
render();
sync();
</script>
</body>
</html>
