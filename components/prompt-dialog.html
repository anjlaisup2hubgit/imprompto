  <div class="ov" id="modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <h2 id="ftitle">New prompt</h2>
    <label for="f-title">TITLE</label><input type="text" id="f-title" maxlength="80" placeholder="Leave blank to fill in automatically">
    <label for="f-cat">CATEGORY</label><input type="text" id="f-cat" list="catlist" maxlength="30" placeholder="Leave blank to fill in automatically"><datalist id="catlist"></datalist>
    <label for="f-text">PROMPT</label><textarea id="f-text" placeholder="Paste your prompt here…"></textarea>
    <div class="err" id="ferr" role="alert"></div>
    <div class="btns"><button class="btn main" id="f-save">Save</button><button class="btn" id="f-cancel">Cancel</button></div>
  </div></div>
